name: macOS Release

on:
  push:
    # macos-vX.Y.Z is the macOS release track; bare vX.Y.Z stays supported for
    # the tags created before the split.
    tags: ['macos-v*', 'v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Full native gates
        run: bash scripts/verify-macos-all.sh

      - name: Package app bundle
        run: |
          version="${GITHUB_REF_NAME:-}"
          version="${version#macos-v}"
          version="${version#v}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && -n "$version" ]]; then
            PETSONA_VERSION="$version" ./scripts/package-macos.sh dist
          else
            ./scripts/package-macos.sh dist
          fi

      - name: Smoke packaged app
        env:
          PETSONA_NATIVE_APP: dist/Petsona.app
          PETSONA_SMOKE_STATE_PORT: 17872
          PETSONA_SMOKE_HOOK_PORT: 17873
        run: bash scripts/macos-smoke.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Petsona-macos-${{ runner.arch }}-unsigned
          path: dist/
          if-no-files-found: error
