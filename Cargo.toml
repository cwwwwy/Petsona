[workspace]
resolver = "2"
members = [
    "crates/petsona-core",
    "crates/petsona-runtime",
    "crates/petsona-ffi",
]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2021"
license = "MIT"
authors = ["cwwwwy"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# The native frontends call through a C ABI. The FFI layer catches unwinding
# panics and turns them into a terminal engine error instead of unwinding into
# Swift or .NET. Undefined pointers and OOM remain process-fatal.
panic = "unwind"
